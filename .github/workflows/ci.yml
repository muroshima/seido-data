name: ci

on:
  pull_request:
  push:
    branches: [main]
    paths: ["builder/**", "tests/**", "registry/**", "pyproject.toml", "uv.lock"]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv sync --frozen
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run seido registry check
      - run: uv run pytest -q
