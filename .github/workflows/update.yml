# 対応表（registry/sources.csv）の取得元を見に行き、変化があればデータのコミットを main に積む。
# コードと対応表の変更は PR で入れる。このワークフローが main に直接積むのは raw/ と seido/ だけ。
name: update

on:
  schedule:
    # 決まった時刻の起動は scripts/kick.sh（launchd など）が workflow_dispatch で行う。GitHub の
    # 定期実行は数時間遅れたり飛ばされたりするので、ここは起動されなかった日の予備。毎時 0 分は混むのでずらす
    - cron: "23 18 * * *" # 03:23 JST
  workflow_dispatch:
    inputs:
      source_ids:
        description: 取り込む source_id（空白区切り）。空なら日次と同じ（取込中で更新が止まっていないもの）
        required: false
        default: ""
      allow_drop:
        description: 制度ページが前回より大きく減っても書き込む source_id（空白区切り）
        required: false
        default: ""

permissions:
  contents: write
  issues: write # 取り込めなかった取得元を Issue で知らせる
  actions: read # 予備の定期実行が、その日の巡回が済んでいるかを見る

concurrency:
  group: update
  cancel-in-progress: false

jobs:
  # 予備の定期実行は、12 時間以内に別の巡回（kick.sh からの起動）があれば何もしない
  guard:
    # 公開用のリポジトリ（mirror.yml の送り先）には同じファイルがあるが、そこでは動かさない
    if: github.repository == 'muroshima/seido'
    runs-on: [self-hosted, seido]
    timeout-minutes: 5
    outputs:
      skip: ${{ steps.check.outputs.skip }}
    steps:
      - uses: actions/checkout@v4
        if: github.event_name == 'schedule'
        with:
          ref: main
          sparse-checkout: scripts
      - id: check
        if: github.event_name == 'schedule'
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ github.run_id }}
        run: python3 scripts/ran_recently.py

  update:
    needs: guard
    if: needs.guard.outputs.skip != 'true'
    # 自宅 PC の self-hosted runner（ラベル seido）。自治体のサイトには、GitHub のランナー
    # （海外の IP）から接続できないものがあるため。schedule と workflow_dispatch でしか起動しない
    runs-on: [self-hosted, seido]
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: astral-sh/setup-uv@v5
      - run: uv sync --frozen
      - name: git の作者
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
      - name: 取り込み
        env:
          SOURCE_IDS: ${{ inputs.source_ids }}
          ALLOW_DROP: ${{ inputs.allow_drop }}
          # GPU は Kaggle のジョブと共有。空いていなければ待たずに巡回の結果だけを書き、
          # 取り出しは fill.yml に回す（待つと、その間は書き込みもコミットも進まない）
          SEIDO_GPU_LOCK_WAIT: "0"
          # 取得元は自治体ごとにホストが違うので、多めに並べる（同じホストへは 1 本ずつ）
          SEIDO_FETCH_WORKERS: "48"
          # 抽出は始めてから 180 分まで。残りは次の実行に回し、240 分の上限内で push まで終える
          SEIDO_EXTRACT_BUDGET: "10800"
          # 始めてから 210 分で、まだ取れていない取得元は次の実行に回す
          SEIDO_RUN_BUDGET: "12600"
          SEIDO_FAILED_FILE: ${{ runner.temp }}/failed.tsv
        run: |
          allow=()
          for sid in $ALLOW_DROP; do allow+=(--allow-drop "$sid"); done
          if [ -n "$SOURCE_IDS" ]; then
            # shellcheck disable=SC2086 # 空白区切りを引数に分けたい
            uv run seido update $SOURCE_IDS --commit --extract "${allow[@]}"
          else
            uv run seido update --daily --commit --extract "${allow[@]}"
          fi
      # 一部の取得元が失敗して exit 2 でも、取れた分のコミットは積む。
      # 実行中に main へ対応表やコードの変更が入っていたら、その上に載せ直してから push する
      - if: ${{ !cancelled() }}
        run: |
          git pull --rebase origin main
          git push origin HEAD:main
      - name: 取り込めなかった取得元を Issue で知らせる
        # 失敗が無ければ、seido update はファイルを書かず、スクリプトは何もしない
        if: ${{ !cancelled() }}
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: uv run python scripts/report_failures.py "$RUNNER_TEMP/failed.tsv"
