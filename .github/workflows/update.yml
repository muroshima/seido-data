# 対応表（registry/sources.csv）の取得元を見に行き、変化があればデータのコミットを main に積む。
# コードと対応表の変更は PR で入れる。このワークフローが main に直接積むのは raw/ と seido/ だけ。
name: update

on:
  schedule:
    # 決まった時刻の起動は scripts/kick.sh（launchd など）が workflow_dispatch で行う。GitHub の
    # 定期実行は数時間遅れたり飛ばされたりするので、ここは起動されなかった日の予備。毎時 0 分は混むのでずらす
    - cron: "23 18 * * *" # 03:23 JST
  workflow_dispatch:
    inputs:
      source_ids:
        description: 取り込む source_id（空白区切り）。空なら日次と同じ（取込中で更新が止まっていないもの）
        required: false
        default: ""

permissions:
  contents: write
  actions: read # 予備の定期実行が、その日の巡回が済んでいるかを見る

concurrency:
  group: update
  cancel-in-progress: false

jobs:
  # 予備の定期実行は、18 時間以内に別の巡回（kick.sh からの起動）があれば何もしない
  guard:
    # 公開用のリポジトリ（mirror.yml の送り先）には同じファイルがあるが、そこでは動かさない
    if: github.repository == 'muroshima/seido'
    runs-on: [self-hosted, seido]
    timeout-minutes: 5
    outputs:
      skip: ${{ steps.check.outputs.skip }}
    steps:
      - uses: actions/checkout@v4
        if: github.event_name == 'schedule'
        with:
          ref: main
          sparse-checkout: scripts
      - id: check
        if: github.event_name == 'schedule'
        env:
          GH_TOKEN: ${{ github.token }}
          API: ${{ github.api_url }}/repos/${{ github.repository }}/actions/workflows/update.yml/runs?per_page=20
          RUN_ID: ${{ github.run_id }}
        run: |
          curl -fsS -H "Authorization: Bearer $GH_TOKEN" "$API" | python3 scripts/ran_recently.py

  update:
    needs: guard
    if: needs.guard.outputs.skip != 'true'
    # 自宅 PC の self-hosted runner（ラベル seido）。自治体のサイトには、GitHub のランナー
    # （海外の IP）から接続できないものがあるため。schedule と workflow_dispatch でしか起動しない
    runs-on: [self-hosted, seido]
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: astral-sh/setup-uv@v5
      - run: uv sync --frozen
      - name: git の作者
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
      - name: 取り込み
        env:
          SOURCE_IDS: ${{ inputs.source_ids }}
          # GPU は Kaggle のジョブと共有。空くまで最大 1 時間待ち、空かなければ巡回の結果だけを書く
          SEIDO_GPU_LOCK_WAIT: "3600"
          # 抽出は始めてから 180 分まで。残りは次の実行に回し、240 分の上限内で push まで終える
          SEIDO_EXTRACT_BUDGET: "10800"
          # 始めてから 210 分で、まだ取れていない取得元は次の実行に回す
          SEIDO_RUN_BUDGET: "12600"
        run: |
          if [ -n "$SOURCE_IDS" ]; then
            # shellcheck disable=SC2086 # 空白区切りを引数に分けたい
            uv run seido update $SOURCE_IDS --commit --extract
          else
            uv run seido update --daily --commit --extract
          fi
      # 一部の取得元が失敗して exit 2 でも、取れた分のコミットは積む。
      # 実行中に main へ対応表やコードの変更が入っていたら、その上に載せ直してから push する
      - if: ${{ !cancelled() }}
        run: |
          git pull --rebase origin main
          git push origin HEAD:main
