# 対応表（registry/sources.csv）の取得元を見に行き、変化があればデータのコミットを main に積む。
# コードと対応表の変更は PR で入れる。このワークフローが main に直接積むのは raw/ と seido/ だけ。
name: update

on:
  schedule:
    - cron: "0 18 * * *" # 03:00 JST
  workflow_dispatch:
    inputs:
      source_ids:
        description: 取り込む source_id（空白区切り）。空なら日次と同じ（取込中で更新が止まっていないもの）
        required: false
        default: ""

permissions:
  contents: write

concurrency:
  group: update
  cancel-in-progress: false

jobs:
  update:
    # 自宅 PC の self-hosted runner（ラベル seido）。自治体のサイトには、GitHub のランナー
    # （海外の IP）から接続できないものがあるため。schedule と workflow_dispatch でしか起動しない
    runs-on: [self-hosted, seido]
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: astral-sh/setup-uv@v5
      - run: uv sync --frozen
      - name: git の作者
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
      - name: 取り込み
        env:
          SOURCE_IDS: ${{ inputs.source_ids }}
          # GPU は Kaggle のジョブと共有。空くまで最大 1 時間待ち、空かなければ巡回の結果だけを書く
          SEIDO_GPU_LOCK_WAIT: "3600"
        run: |
          if [ -n "$SOURCE_IDS" ]; then
            # shellcheck disable=SC2086 # 空白区切りを引数に分けたい
            uv run seido update $SOURCE_IDS --commit --extract
          else
            uv run seido update --daily --commit --extract
          fi
      # 一部の取得元が失敗して exit 2 でも、取れた分のコミットは積む
      - if: ${{ !cancelled() }}
        run: git push origin HEAD:main
